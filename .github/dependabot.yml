version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # MediatR moved to a paid licence at v13; v12 is the last freely licensed line.
      - dependency-name: MediatR
        update-types: [version-update:semver-major]
      # Same for MassTransit at v9.
      - dependency-name: MassTransit*
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /src/TakeAuction.Web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # React 19 needs @react-three/fiber v9 and drei v10; the versions pinned here still
      # declare a React 16-18 peer range, so npm cannot resolve the tree. Revisit together.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react"
        update-types: [version-update:semver-major]
      - dependency-name: "@types/react-dom"
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      # The other half of that same decision. fiber v9 asks for react >=19 <19.3 and drei
      # v10 for react ^19, so neither can land while React is held at 18 - leaving them out
      # of the ignore list only reopened a pull request every week that could never merge.
      - dependency-name: "@react-three/fiber"
        update-types: [version-update:semver-major]
      - dependency-name: "@react-three/drei"
        update-types: [version-update:semver-major]
      # TypeScript 7 type-checks, builds and tests this client fine, but typescript-eslint
      # refuses to load against the 7.0 API, so taking it would cost the linter entirely.
      # Tracked at https://github.com/typescript-eslint/typescript-eslint/issues/10940.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # three is pinned to the exact version fiber v8 was built against (96c2697): 0.185
      # deprecates PCFSoftShadowMap and silently downgrades it, which took the showcase's
      # contact shadows out in production. three moves when fiber does, not before - and
      # fiber waits on React 19. Dependabot reads a 0.x bump as minor, so ignore outright.
      - dependency-name: three
      - dependency-name: "@types/three"

  - package-ecosystem: npm
    directory: /tests/TakeAuction.E2E
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /src/TakeAuction.Api
      - /src/TakeAuction.Web
    schedule:
      interval: weekly
      day: monday
