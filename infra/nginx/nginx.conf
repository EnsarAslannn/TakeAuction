upstream takeauction_api {
    server api:8080;
    keepalive 32;
}

upstream takeauction_web {
    server web:80;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    access_log /var/log/nginx/takeauction.access.log;
    error_log  /var/log/nginx/takeauction.error.log warn;

    # Uploaded images can be several megabytes; the API enforces the real ceiling.
    client_max_body_size 8m;

    # Declared once at server level and inherited by every location. A location that sets
    # any proxy_set_header of its own would drop all of these, so none of them do.
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    100s;

    # Bids and hub frames have to reach the client as they happen, not when a buffer fills.
    proxy_buffering off;

    location /api/ {
        proxy_pass http://takeauction_api;
    }

    location /hubs/ {
        proxy_pass http://takeauction_api;

        # SignalR holds its connection open far longer than a request/response round trip.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass http://takeauction_api;
    }

    location /health {
        proxy_pass http://takeauction_api;
        access_log off;
    }

    location / {
        proxy_pass http://takeauction_web;
    }
}
