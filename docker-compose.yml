name: takeauction

services:
  postgres:
    image: postgres:17-alpine
    container_name: takeauction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-takeauction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-takeauction_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-takeauction}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-takeauction} -d ${POSTGRES_DB:-takeauction}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - takeauction-network

  redis:
    image: redis:7-alpine
    container_name: takeauction-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - takeauction-network

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: takeauction-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-takeauction}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-takeauction_dev_pw}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - takeauction-network

  api:
    build:
      context: .
      dockerfile: src/TakeAuction.Api/Dockerfile
    image: takeauction/api:local
    container_name: takeauction-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-takeauction};Username=${POSTGRES_USER:-takeauction};Password=${POSTGRES_PASSWORD:-takeauction_dev_pw}
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__RabbitMq: amqp://${RABBITMQ_USER:-takeauction}:${RABBITMQ_PASSWORD:-takeauction_dev_pw}@rabbitmq:5672
      # Only the gateway ever talks to the API, and it lives on the compose bridge — without
      # this the forwarded client IP is discarded and rate limiting partitions on nginx.
      ReverseProxy__KnownNetworks__0: 172.16.0.0/12
    volumes:
      - api_uploads:/app/App_Data/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - takeauction-network

  web:
    build:
      context: .
      dockerfile: src/TakeAuction.Web/Dockerfile
    image: takeauction/web:local
    container_name: takeauction-web
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: that resolves to ::1 first and nginx binds IPv4 only.
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - takeauction-network

  nginx:
    image: nginx:1.27-alpine
    container_name: takeauction-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - takeauction-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  api_uploads:

networks:
  takeauction-network:
    driver: bridge
